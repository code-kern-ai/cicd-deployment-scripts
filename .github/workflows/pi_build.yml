name: 'Parent Images: Build'

on:
  workflow_call:

# Special permissions required for OIDC authentication
permissions:
  id-token: write
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  pi-diff:
    name: 'Parent Images: Diff Types'
    runs-on: ubuntu-latest
    environment: dev
    env:
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
    outputs:
      include: ${{ steps.get-diff.outputs.include }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/refinery-submodule-parent-images
          ref: ${{ github.event.pull_request.head.ref }}
    
      - name: GitHub Configuration
        run: git config --global url."https://oauth2:${{ secrets.GH_TOKEN }}@github.com".insteadOf https://github.com

      - name: Clone cicd-deployment-scripts
        run: git clone --branch parent-images https://github.com/code-kern-ai/cicd-deployment-scripts.git

      - name: Get Diff Types
        id: get-diff
        run: |
          bash cicd-deployment-scripts/pi/diff.sh \
            -p "${{ github.event.pull_request.number }}" \
            -s cicd-deployment-scripts/pi/settings.sh

  pi-matrix-test:
    name: 'Parent Images: Matrix Test'
    runs-on: ubuntu-latest
    needs: [pi-diff]
    environment: dev
    env:
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
    strategy:
      matrix: 
        include: ${{ fromJson(needs.pi-diff.outputs.include) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: '${{ github.repository_owner }}/refinery-${{ matrix.parent_image_type }}-parent-image'
          submodules: 'true'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: python -m pip install pip-tools
      
      - name: Compile Requirements
        run: pip-compile submodules/parent-images/requirements/${{ matrix.parent_image_type }}-requirements.in

      - name: Create PR - ${{ matrix.app }}
        run: |
          git clone https://oauth2:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository_owner }}/${{ matrix.app }}.git
          cd ${{ matrix.app }}

          git config user.email "devtools@kern.ai"
          git config user.name "GitHub Actions"

          git checkout -b ${{ github.event.pull_request.head.ref }} || git checkout ${{ github.event.pull_request.head.ref }}
          git push origin ${{ github.event.pull_request.head.ref }} && git pull origin ${{ github.event.pull_request.head.ref }}

          git add requirements/${{ matrix.parent_image_type }}-requirements.txt
          git commit -m "ci: update ${{ matrix.parent_image_type }}-requirements.txt"
          git push origin ${{ github.event.pull_request.head.ref }}
          echo "::notice::${{ matrix.app }} updated to origin/${{ github.event.pull_request.head.ref }}"

          gh pr create \
            --title "${{ github.event.pull_request.title }}" \
            --body "${{ github.event.pull_request.body }}" \
            --base dev \
            --head ${{ github.event.pull_request.head.ref }} \
            --repo ${{ github.repository_owner }}/${{ matrix.app }}

