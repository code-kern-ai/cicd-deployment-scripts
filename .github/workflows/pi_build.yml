name: 'Parent Images: Build'

on:
  workflow_call:

# Special permissions required for OIDC authentication
permissions:
  id-token: write
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  validate-branch-name:
    name: 'Validate Head Branch Name'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          if [ "${{ github.event.pull_request.head.ref }}" != "parent-image-updates" ]; then
            echo "::error::Branch name must be 'parent-image-updates'. Current branch name: ${{ github.event.pull_request.head.ref }}"
            exit 1
          fi

  pi-matrix:
    uses: code-kern-ai/cicd-deployment-scripts/.github/workflows/pi_matrix.yml@dev
    secrets: inherit
    needs: [validate-branch-name]
    with:
      checkout_ref: parent-image-updates
      repository: "${{ github.repository_owner }}/refinery-submodule-parent-images"
      edit_dockerfile: true

  pi-build:
    name: 'Parent Images: Docker Build'
    runs-on: ubuntu-latest
    needs: [pi-matrix, validate-branch-name]
    environment: dev
    env:
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
      DEV_CONTAINER_REGISTRY: ${{ vars.DEV_CONTAINER_REGISTRY }}
      DEV_LOGIN_USERNAME: ${{ secrets.DEV_LOGIN_USERNAME }}
      DEV_LOGIN_PASSWORD: ${{ secrets.DEV_LOGIN_PASSWORD }}
      PARENT_IMAGE_NAME: ${{ vars.PARENT_IMAGE_NAME }}
      DOCKERFILE: ${{ vars.DOCKERFILE }}
      HEAD_REF: parent-image-updates
      IMAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'parent-image-updates' }}
    strategy:
      matrix:
        parent_image_type: ${{ fromJson(needs.pi-matrix.outputs.parent_image_type) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: '${{ github.repository_owner }}/refinery-${{ matrix.parent_image_type }}-parent-image'
          fetch-depth: 0
          submodules: 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        if: matrix.parent_image_type != 'next'
        run: python -m pip install pip-tools
      
      - name: Compile Requirements
        run: |
          cd ${{ github.workspace }}/submodules/parent-images
          git checkout ${{ env.HEAD_REF }}
          pip-compile requirements/${{ matrix.parent_image_type }}-requirements.in

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Log into DEV registry
        uses: docker/login-action@v3
        with:
          registry: "${{ env.DEV_CONTAINER_REGISTRY }}"
          username: "${{ env.DEV_LOGIN_USERNAME }}"
          password: "${{ env.DEV_LOGIN_PASSWORD }}"

      - name: Build & Push ${{ env.PARENT_IMAGE_NAME }}:${{ env.HEAD_REF }}-${{ matrix.parent_image_type }}
        uses: docker/build-push-action@v5
        with:
          context: .
          cache-from: type=registry,ref=${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:dev-${{ matrix.parent_image_type }}-cache
          cache-to: type=registry,ref=${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:dev-${{ matrix.parent_image_type }}-cache,mode=max,image-manifest=true
          platforms: linux/amd64,linux/arm64
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ env.HEAD_REF }}-${{ matrix.parent_image_type }}
          push: true
          build-args: |
            platform=linux/amd64,linux/arm64
            label=dockerfile-path=https://github.com/refinery-${{ matrix.parent_image_type }}-parent-image/blob/${{ github.sha }}/${{ env.DOCKERFILE }}

      # - name: Build & Push ${{ env.PARENT_IMAGE_NAME }}:${{ env.HEAD_REF }}-${{ matrix.parent_image_type }}-arm64
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     cache-from: type=registry,ref=${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:dev-${{ matrix.parent_image_type }}-arm64-cache
      #     cache-to: type=registry,ref=${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:dev-${{ matrix.parent_image_type }}-arm64-cache,mode=max,image-manifest=true
      #     platforms: linux/arm64
      #     file: ${{ env.DOCKERFILE }}
      #     tags: ${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ env.HEAD_REF }}-${{ matrix.parent_image_type }}-arm64
      #     push: true
      #     build-args: |
      #       platform=linux/arm64
      #       label=dockerfile-path=https://github.com/refinery-${{ matrix.parent_image_type }}-parent-image/blob/${{ github.sha }}/${{ env.DOCKERFILE }}

  pi-update-app:
    name: 'Parent Images: App'
    runs-on: ubuntu-latest
    needs: [pi-matrix, pi-build, validate-branch-name]
    environment: dev
    continue-on-error: true
    env:
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
      DOCKERHUB_CONTAINER_REGISTRY: ${{ vars.DOCKERHUB_CONTAINER_REGISTRY }}
      DEV_CONTAINER_REGISTRY: ${{ vars.DEV_CONTAINER_REGISTRY }}
      PARENT_IMAGE_NAME: ${{ vars.PARENT_IMAGE_NAME }}
      DOCKERFILE: ${{ vars.DOCKERFILE }}
      HEAD_REF: parent-image-updates
    strategy:
      matrix: 
        app: ${{ fromJson(needs.pi-matrix.outputs.app) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: '${{ github.repository_owner }}/refinery-submodule-parent-images'
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: python -m pip install pip-tools

      - name: Clone cicd-deployment-scripts
        run: git clone https://oauth2:${{ secrets.GH_TOKEN }}@github.com/code-kern-ai/cicd-deployment-scripts.git

      - name: Clone ${{ matrix.app }}
        run: |
          git clone --recurse-submodules https://oauth2:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository_owner }}/${{ matrix.app }}.git
          cd ${{ github.workspace }}/${{ matrix.app }}

          git config user.email "devtools@kern.ai"
          git config user.name "GitHub Actions"

          git checkout -b ${{ env.HEAD_REF }} || git checkout ${{ env.HEAD_REF }}
          git pull origin ${{ env.HEAD_REF }} || true
      
      - name: Update parent requirements
        if: github.run_attempt == 1
        run: |
          cd ${{ github.workspace }}/${{ matrix.app }}
          REQUIREMENTS_FILES=$(ls requirements/*.txt)
          for requirement_file in $REQUIREMENTS_FILES; do
            cp ${{ github.workspace }}/$requirement_file $requirement_file
          done

      - name: Perform Edit/Git Operations (Python)
        run: |
          cd ${{ github.workspace }}/${{ matrix.app }}

          bash ${{ github.workspace }}/cicd-deployment-scripts/pi/edit_dockerfile.sh \
            -i "${{ env.PARENT_IMAGE_NAME }}" \
            -l "${{ env.HEAD_REF }}" \
            -r "${{ env.DOCKERHUB_CONTAINER_REGISTRY }}" \
            -e "${{ env.DEV_CONTAINER_REGISTRY }}" \
            -d "${{ env.DOCKERFILE }}" \
            -t "build"

          if [ -f "dev.${{ env.DOCKERFILE }}" ]; then
            bash ${{ github.workspace }}/cicd-deployment-scripts/pi/edit_dockerfile.sh \
              -i "${{ env.PARENT_IMAGE_NAME }}" \
              -l "${{ env.HEAD_REF }}" \
              -r "${{ env.DOCKERHUB_CONTAINER_REGISTRY }}" \
              -e "${{ env.DEV_CONTAINER_REGISTRY }}" \
              -d "dev.${{ env.DOCKERFILE }}" \
              -t "build"
          fi
          
          if [ -f "gpu.${{ env.DOCKERFILE }}" ]; then
            bash ${{ github.workspace }}/cicd-deployment-scripts/pi/edit_dockerfile.sh \
              -i "${{ env.PARENT_IMAGE_NAME }}" \
              -l "${{ env.HEAD_REF }}" \
              -r "${{ env.DOCKERHUB_CONTAINER_REGISTRY }}" \
              -e "${{ env.DEV_CONTAINER_REGISTRY }}" \
              -d "gpu.${{ env.DOCKERFILE }}" \
              -t "build"
          fi

          git add requirements/*.txt ${{ env.DOCKERFILE }}
          git add dev.${{ env.DOCKERFILE }} || true
          git add gpu.${{ env.DOCKERFILE }} || true
          git commit -m "ci: update requirements and Dockerfile" || true
          echo "::notice::${{ matrix.app }} - updated requirement files and ${{ env.DOCKERFILE }}s"

          rm -f requirements.txt gpu-requirements.txt || true

          export exitcode=0
          pip-compile --quiet \
            --output-file requirements.txt \
            requirements/requirements.in || export exitcode=$?
          
          if [ $exitcode -ne 0 ]; then
            echo "::error::pip-compile failed with exit code $exitcode"
            git push origin ${{ env.HEAD_REF }} || true
            exit $exitcode
          fi
          
          if [ -f requirements/gpu-requirements.in ]; then
            export exitcode=0
            pip-compile --quiet \
              --output-file gpu-requirements.txt \
              requirements/gpu-requirements.in || export exitcode=$?

            if [ $exitcode -ne 0 ]; then
              echo "::error::pip-compile for GPU requirements failed with exit code $exitcode"
              exit $exitcode
            fi
          fi

          git add requirements.txt
          git add gpu-requirements.txt || true
          git commit -m "ci: update requirements.txt" || true
          git push origin ${{ env.HEAD_REF }}
          echo "::notice::${{ matrix.app }} - updated requirements.txt"

          gh pr create --draft \
            --title "test: parent image updates" \
            --body "Main PR: https://github.com/${{ github.repository_owner }}/refinery-submodule-parent-images/pull/${{ github.event.pull_request.number }}" \
            --base dev \
            --head ${{ env.HEAD_REF }} \
            --repo ${{ github.repository_owner }}/${{ matrix.app }} || true
