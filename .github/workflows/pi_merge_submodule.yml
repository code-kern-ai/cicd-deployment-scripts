name: 'Parent Images: Submodule Merge'

on:
  workflow_call:

# Special permissions required for OIDC authentication
permissions:
  id-token: write
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  configure-branch-name:
    name: 'Configure Head Branch Name'
    runs-on: ubuntu-latest
    outputs:
      gh_head_ref: ${{ steps.configure-branch-name.outputs.gh_head_ref }}
    steps:
      - name: Configure branch name
        id: configure-branch-name
        run: echo "gh_head_ref=$(echo "${{ github.event.pull_request.head.ref }}" | sed 's|/|-|g')" >> $GITHUB_OUTPUT

  pi-matrix:
    uses: code-kern-ai/cicd-deployment-scripts/.github/workflows/pi_matrix.yml@dev
    secrets: inherit
    with:
      checkout_ref: ${{ github.event.pull_request.base.ref }}
      repository: "${{ github.repository_owner }}/refinery-submodule-parent-images"

  pi-update-parent-images:
    name: 'Parent Images: Update Submodules'
    runs-on: ubuntu-latest
    needs: [configure-branch-name, pi-matrix]
    environment: dev
    env:
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
    strategy:
      matrix:
        parent_image_type: ${{ fromJson(needs.pi-matrix.outputs.parent_image_type) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: '${{ github.repository_owner }}/refinery-${{ matrix.parent_image_type }}-parent-image'
          fetch-depth: 0
          submodules: 'true'

      - name: Perform Edit/Git Operations
        run: |
          git config user.email "devtools@kern.ai"
          git config user.name "GitHub Actions"

          git submodule update --remote --merge || true

          git add submodules
          git commit -m "ci: update submodules to origin/${{ github.event.pull_request.base.ref }}" || true
          git push origin ${{ github.event.pull_request.base.ref }}
          echo "::notice::${{ github.event.repository.name }} updated to origin/${{ github.event.pull_request.base.ref }}"

  gh-delete-submodule-branches:
    name: 'GitHub: Delete Submodule Branch'
    needs: [configure-branch-name, pi-update-submodule]
    if: ${{ !failure() && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Delete Branch
        shell: bash
        run: git push origin --delete ${{ needs.configure-branch-name.outputs.gh_head_ref }} || true