name: 'Parent Images: Release'

on:
  workflow_call:

# Special permissions required for OIDC authentication
permissions:
  id-token: write
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  pi-matrix:
    uses: code-kern-ai/cicd-deployment-scripts/.github/workflows/pi_matrix.yml@dev
    secrets: inherit
    with:
      repository: ${{ github.repository }}
      parent_image_type: ${{ vars.PARENT_IMAGE_TYPE }}
      edit_dockerfile: true

  pi-edit:
    name: 'Parent Images: Dockerfile' # suffix populated by matrix
    runs-on: ubuntu-latest
    needs: [pi-matrix]
    environment: dev
    env:
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
      DOCKERHUB_CONTAINER_REGISTRY: ${{ vars.DOCKERHUB_CONTAINER_REGISTRY }}
      DOCKERHUB_LOGIN_USERNAME: ${{ secrets.DOCKERHUB_LOGIN_USERNAME }}
      DOCKERHUB_LOGIN_PASSWORD: ${{ secrets.DOCKERHUB_LOGIN_PASSWORD }}
      PARENT_IMAGE_NAME: ${{ vars.PARENT_IMAGE_NAME }}
      PARENT_IMAGE_TYPE: ${{ vars.PARENT_IMAGE_TYPE }}
      DOCKERFILE: ${{ vars.DOCKERFILE }}
      HEAD_REF: parent-image-updates
    strategy:
      matrix:
        app: ${{ fromJson(needs.pi-matrix.outputs.app) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: ${{ github.repository_owner }}/${{ matrix.app }}
          fetch-depth: 0
        
      - name: Clone cicd-deployment-scripts
        run: git clone https://oauth2:${{ secrets.GH_TOKEN }}@github.com/code-kern-ai/cicd-deployment-scripts.git

      - name: Perform Edit/Git Operations
        run: |
          RELEASE_IMAGE="${{ env.DOCKERHUB_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.event.release.tag_name }}-${{ vars.PARENT_IMAGE_TYPE }}"
          BASE_REF="dev"
          PR_TITLE="ci(pi): $RELEASE_IMAGE"

          git config user.email "devtools@kern.ai"
          git config user.name "GitHub Actions"
          
          git checkout "${{ env.HEAD_REF }}" || git checkout -b "${{ env.HEAD_REF }}"
          git push origin "${{ env.HEAD_REF }}" && git pull origin "${{ env.HEAD_REF }}"

          bash cicd-deployment-scripts/pi/edit_dockerfile.sh \
            -i "${{ env.PARENT_IMAGE_NAME }}" \
            -l "${{ github.event.release.tag_name }}" \
            -r "${{ env.DOCKERHUB_CONTAINER_REGISTRY }}" \
            -d "${{ env.DOCKERFILE }}" \
            -h "${{ env.HEAD_REF }}"
          git add ${{ env.DOCKERFILE }}

          if [ -f "dev.${{ env.DOCKERFILE }}" ]; then
            bash ${{ github.workspace }}/cicd-deployment-scripts/pi/edit_dockerfile.sh \
              -i "${{ env.PARENT_IMAGE_NAME }}" \
              -l "${{ github.event.release.tag_name }}" \
              -r "${{ env.DOCKERHUB_CONTAINER_REGISTRY }}" \
              -d "dev.${{ env.DOCKERFILE }}" \
              -h "${{ env.HEAD_REF }}"
            git add dev.${{ env.DOCKERFILE }}
          fi
          
          if [ -f "gpu.${{ env.DOCKERFILE }}" ]; then
            bash ${{ github.workspace }}/cicd-deployment-scripts/pi/edit_dockerfile.sh \
              -i "${{ env.PARENT_IMAGE_NAME }}" \
              -l "${{ github.event.release.tag_name }}" \
              -r "${{ env.DOCKERHUB_CONTAINER_REGISTRY }}" \
              -d "gpu.${{ env.DOCKERFILE }}" \
              -h "${{ env.HEAD_REF }}"
            git add gpu.${{ env.DOCKERFILE }}
          fi

          git commit -m "$PR_TITLE" || true
          git push --force origin "${{ env.HEAD_REF }}"
          echo "::notice::${{ matrix.app }} updated to $RELEASE_IMAGE"

          bash cicd-deployment-scripts/pi/pr_create.sh \
            -b "$BASE_REF" \
            -h "${{ env.HEAD_REF }}" \
            -t "$PR_TITLE" \
            -o ${{ github.repository_owner }} \
            -r ${{ github.event.repository.name }} \
            -n ${{ github.event.release.tag_name }} \
            -a ${{ matrix.app }}

  call-gh-release:
    # needs: [call-k8-deploy]
    needs: [pi-edit]
    if: always() && github.event_name == 'release'
    uses: code-kern-ai/cicd-deployment-scripts/.github/workflows/gh_release.yml@dev
    secrets: inherit
    with:
      deployment_status: "success"