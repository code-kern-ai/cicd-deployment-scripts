name: 'DC: Deploy'

on:
  workflow_call:
    inputs:
      ssh_host:
        required: true
        type: string
        description: "SSH host"
      ssh_user:
        required: true
        type: string
        description: "SSH user"
      ssh_private_key:
        required: true
        type: string
        description: "SSH private_key"

# Special permissions required for OIDC authentication
permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  dc-release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ inputs.ssh_host }}
          username: ${{ inputs.ssh_user }}
          key: ${{ inputs.ssh_private_key }}
          script: /bin/sh ./trigger_dev_deployment.sh

  gh-delete-branch:
    name: 'GitHub: Delete Branch'
    runs-on: ubuntu-latest
    needs: [dc-release]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged && !failure() && !cancelled()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Delete Branch
        shell: bash
        run: git push origin --delete ${{ github.head_ref }} || true