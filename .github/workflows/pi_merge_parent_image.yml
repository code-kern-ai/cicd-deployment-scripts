name: 'Parent Images: Parent Image Merge'

on:
  workflow_call:

# Special permissions required for OIDC authentication
permissions:
  id-token: write
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  configure-branch-name:
    name: 'Configure Head Branch Name'
    runs-on: ubuntu-latest
    outputs:
      gh_head_ref: ${{ steps.configure-branch-name.outputs.gh_head_ref }}
    steps:
      - name: Configure branch name
        id: configure-branch-name
        run: echo "gh_head_ref=$(echo "${{ github.event.pull_request.head.ref }}" | sed 's|/|-|g')" >> $GITHUB_OUTPUT

  pi-matrix:
    uses: code-kern-ai/cicd-deployment-scripts/.github/workflows/pi_matrix.yml@dev
    secrets: inherit
    with:
      checkout_ref: ${{ github.event.pull_request.base.ref }}
      repository: "${{ github.repository_owner }}/refinery-submodule-parent-images"
      parent_image_type: ${{ vars.PARENT_IMAGE_TYPE }}

  pi-build:
    name: 'Parent Images: Docker Build'
    runs-on: ubuntu-latest
    environment: dev
    env:
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
      DEV_CONTAINER_REGISTRY: ${{ vars.DEV_CONTAINER_REGISTRY }}
      DEV_LOGIN_USERNAME: ${{ secrets.DEV_LOGIN_USERNAME }}
      DEV_LOGIN_PASSWORD: ${{ secrets.DEV_LOGIN_PASSWORD }}
      PARENT_IMAGE_NAME: ${{ vars.PARENT_IMAGE_NAME }}
      PARENT_IMAGE_TYPE: ${{ vars.PARENT_IMAGE_TYPE }}
      DOCKERFILE: ${{ vars.DOCKERFILE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: python -m pip install pip-tools
      
      - name: Compile Requirements
        run: |
          cd ${{ github.workspace }}/submodules/parent-images
          pip-compile requirements/${{ env.PARENT_IMAGE_TYPE }}-requirements.in

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Log into DEV registry
        uses: docker/login-action@v3
        with:
          registry: "${{ env.DEV_CONTAINER_REGISTRY }}"
          username: "${{ env.DEV_LOGIN_USERNAME }}"
          password: "${{ env.DEV_LOGIN_PASSWORD }}"

      - name: Build & Push ${{ env.PARENT_IMAGE_NAME }}:${{ github.event.pull_request.base.ref }}-${{ env.PARENT_IMAGE_TYPE }}
        uses: docker/build-push-action@v5
        with:
          context: .
          cache-from: type=registry,ref=${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.event.pull_request.base.ref }}-${{ env.PARENT_IMAGE_TYPE }}-cache
          cache-to: type=registry,ref=${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.event.pull_request.base.ref }}-${{ env.PARENT_IMAGE_TYPE }}-cache,mode=max,image-manifest=true
          platforms: linux/amd64
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.event.pull_request.base.ref }}-${{ env.PARENT_IMAGE_TYPE }}
          push: true
          build-args: |
            platform=linux/amd64
            label=dockerfile-path=https://github.com/refinery-${{ env.PARENT_IMAGE_TYPE }}-parent-image/blob/${{ github.sha }}/Dockerfile

      - name: Build & Push ${{ env.PARENT_IMAGE_NAME }}:${{ github.event.pull_request.base.ref }}-${{ env.PARENT_IMAGE_TYPE }}-arm64
        uses: docker/build-push-action@v5
        with:
          context: .
          cache-from: type=registry,ref=${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.event.pull_request.base.ref }}-${{ env.PARENT_IMAGE_TYPE }}-arm64-cache
          cache-to: type=registry,ref=${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.event.pull_request.base.ref }}-${{ env.PARENT_IMAGE_TYPE }}-arm64-cache,mode=max,image-manifest=true
          platforms: linux/arm64
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.event.pull_request.base.ref }}-${{ env.PARENT_IMAGE_TYPE }}-arm64
          push: true
          build-args: |
            platform=linux/arm64
            label=dockerfile-path=https://github.com/refinery-${{ env.PARENT_IMAGE_TYPE }}-parent-image/blob/${{ github.sha }}/Dockerfile

      - name: Build & Push ${{ env.PARENT_IMAGE_NAME }}:sha-${{ env.PARENT_IMAGE_TYPE }}
        uses: docker/build-push-action@v5
        with:
          context: .
          cache-from: type=registry,ref=${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.sha }}-${{ env.PARENT_IMAGE_TYPE }}-cache
          cache-to: type=registry,ref=${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.sha }}-${{ env.PARENT_IMAGE_TYPE }}-cache,mode=max,image-manifest=true
          platforms: linux/amd64
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.sha }}-${{ env.PARENT_IMAGE_TYPE }}
          push: true
          build-args: |
            platform=linux/amd64
            label=dockerfile-path=https://github.com/refinery-${{ env.PARENT_IMAGE_TYPE }}-parent-image/blob/${{ github.sha }}/Dockerfile

      - name: Build & Push ${{ env.PARENT_IMAGE_NAME }}:sha-${{ env.PARENT_IMAGE_TYPE }}-arm64
        uses: docker/build-push-action@v5
        with:
          context: .
          cache-from: type=registry,ref=${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.sha }}-${{ env.PARENT_IMAGE_TYPE }}-arm64-cache
          cache-to: type=registry,ref=${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.sha }}-${{ env.PARENT_IMAGE_TYPE }}-arm64-cache,mode=max,image-manifest=true
          platforms: linux/arm64
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.DEV_CONTAINER_REGISTRY }}/${{ env.PARENT_IMAGE_NAME }}:${{ github.sha }}-${{ env.PARENT_IMAGE_TYPE }}-arm64
          push: true
          build-args: |
            platform=linux/arm64
            label=dockerfile-path=https://github.com/refinery-${{ env.PARENT_IMAGE_TYPE }}-parent-image/blob/${{ github.sha }}/Dockerfile

  pi-update-app:
    name: 'Parent Images: App'
    runs-on: ubuntu-latest
    needs: [pi-matrix, configure-branch-name, pi-build]
    environment: dev
    continue-on-error: true
    env:
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
    strategy:
      matrix: 
        include: ${{ fromJson(needs.pi-matrix.outputs.include) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      
      - name: Set up Python
        if: matrix.parent_image_type != 'next'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
    
      - name: Install Dependencies
        if: matrix.parent_image_type != 'next'
        run: python -m pip install pip-tools
      
      - name: Clone ${{ matrix.app }}
        run: |
          git clone https://oauth2:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository_owner }}/${{ matrix.app }}.git
          cd ${{ github.workspace }}/${{ matrix.app }}

          git config user.email "devtools@kern.ai"
          git config user.name "GitHub Actions"

          git checkout -b ${{ needs.configure-branch-name.outputs.gh_head_ref }} || git checkout ${{ needs.configure-branch-name.outputs.gh_head_ref }}

      - name: Compile Requirements (Python)
        if: matrix.parent_image_type != 'next'
        run: |
          pip-compile --quiet \
            --output-file ${{ matrix.app }}/requirements/${{ matrix.parent_image_type }}-requirements.txt \
            submodules/parent-images/requirements/${{ matrix.parent_image_type }}-requirements.in
      
      - name: Compile Requirements (Next)
        if: matrix.parent_image_type == 'next'
        run: |
          jq --slurp '.[0] * .[1]' \
            package.json \
            ${{ matrix.app }}/package.json \
            > package.json.tmp
          mv package.json.tmp ${{ matrix.app }}/package.json

      - name: Perform Edit/Git Operations (Python)
        if: matrix.parent_image_type != 'next'
        run: |
          cd ${{ github.workspace }}/${{ matrix.app }}

          git add requirements/${{ matrix.parent_image_type }}-requirements.in
          git commit -m "ci: update ${{ matrix.parent_image_type }}-requirements.txt" || true
          git push origin ${{ needs.configure-branch-name.outputs.gh_head_ref }}
          echo "::notice::${{ matrix.app }} - updated ${{ matrix.parent_image_type }}-requirements.txt"

          export exitcode=0
          pip-compile --quiet \
            --output-file requirements.txt \
            requirements/requirements.in || export exitcode=$?
          
          if [ $exitcode -ne 0 ]; then
            echo "::error::pip-compile failed with exit code $exitcode"
            exit $exitcode
          else
            git add requirements.txt
            git commit -m "ci: update requirements.txt" || true
            git push origin ${{ needs.configure-branch-name.outputs.gh_head_ref }}
            echo "::notice::${{ matrix.app }} - updated requirements.txt"
          fi

          gh pr create --draft \
            --title "${{ github.event.pull_request.title }}" \
            --body "${{ github.event.pull_request.body }}" \
            --base dev \
            --head ${{ needs.configure-branch-name.outputs.gh_head_ref }} \
            --repo ${{ github.repository_owner }}/${{ matrix.app }} || true
          
      - name: Perform Edit/Git Operations (Next)
        if: matrix.parent_image_type == 'next'
        run: |
          cd ${{ github.workspace }}/${{ matrix.app }}

          git add package.json
          git commit -m "ci: update ${{ matrix.parent_image_type }} package.json" || true
          git push origin ${{ needs.configure-branch-name.outputs.gh_head_ref }}
          echo "::notice::${{ matrix.app }} - updated ${{ matrix.parent_image_type }} package.json"

          gh pr create --draft \
            --title "${{ github.event.pull_request.title }}" \
            --body "${{ github.event.pull_request.body }}" \
            --base dev \
            --head ${{ needs.configure-branch-name.outputs.gh_head_ref }} \
            --repo ${{ github.repository_owner }}/${{ matrix.app }} || true

  gh-delete-branch:
    name: 'GitHub: Delete Branch'
    needs: [pi-build]
    if: ${{ !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Delete Branch
        shell: bash
        run: git push origin --delete ${{ github.event.pull_request.head.ref }}
